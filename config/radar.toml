# 认知雷达运行配置。生产环境建议复制为 radar.local.toml，并通过
# RADAR_CONFIG=config/radar.local.toml 指定；radar.local.toml 已被 Git 忽略。

[app]
# unconfigured: 接口启动，但调用模型时返回明确错误
# live: 调用公司内部大模型
# demo: 只运行仓库中的虚构演示数据，不能处理真实请求
model_mode = "unconfigured"
database_path = "data/radar.sqlite3"

[reports]
# /update 只允许读取该目录中的相对 .md 路径，避免任意文件访问。
root_dir = "reports"
# 每个报告会在这里保存 v000001.md、v000002.md 等全部版本和变更说明。
history_dir = "data/report_versions"

# 默认服务对象。调用 /decompose 时仍可通过 organization_context 补充或覆盖。
[organization]
organization_name = "长鑫存储"
industry = "DRAM 设计、研发、制造与销售一体化企业"
business_priorities = [
  "技术代际与产品路线",
  "量产成熟度、良率、质量与单位成本",
  "客户验证、产品组合与重点应用市场",
  "产能建设、资本投入与资源配置",
  "供应链韧性、知识产权与合规风险",
  "DRAM 周期、价格、库存与竞争格局",
]
known_constraints = [
  "半导体研发和产能建设投入高、周期长",
  "DRAM 市场具有明显供需与价格周期",
  "产品结论需要区分研发样品、客户验证和稳定量产阶段",
  "外部信息不能直接推断公司内部良率、成本、产能和客户状态",
]

[organization.leadership_focus_by_topic_type]
"新技术或能力" = [
  "技术成熟度与量产窗口",
  "与产品路线和应用市场的关系",
  "良率、质量、性能和单位成本影响",
  "设备、材料、人才、知识产权等落地约束",
  "客户价值、验证门槛与分阶段投入条件",
]
"行业市场变化" = [
  "分应用需求、价格和库存周期",
  "主要厂商产品、产能和资本开支变化",
  "对产品组合、产能利用和盈利质量的传导",
  "客户结构和采购行为变化",
  "需要持续监测的领先信号",
]
"政策变化" = [
  "适用主体、产品、地区和生效时间",
  "对技术获取、供应链、客户和经营合规的影响",
  "受影响业务与能力缺口",
  "可选响应、资源需求和最晚行动时间",
  "政策解释与执行中的未明确事项",
]
"竞争对象" = [
  "对方战略意图与已经验证的实际动作",
  "技术、产品、量产、产能和客户能力",
  "价格及市场动作对长鑫的影响",
  "可借鉴条件与不可迁移部分",
  "应对选项、窗口期和观察信号",
]
"经营问题" = [
  "问题规模、趋势和影响对象",
  "根因及证据完整性",
  "良率、质量、成本、交付之间的权衡",
  "可选措施、资源投入和副作用",
  "验证指标、责任边界和复盘节点",
]

[llm_profiles.default]
url = "http://your-internal-llm.example/v1/chat/completions"
model = "your-model-name"
# 推荐把真实 Key 放入环境变量 RADAR_LLM_API_KEY。
api_key_env = "RADAR_LLM_API_KEY"
# 也支持直接写 api_key = "..."，但不要把含真实 Key 的本地配置提交到 Git。
timeout_seconds = 90.0
max_context_chars = 180000
temperature = 0.0
max_tokens = 6000
top_p = 1.0
verify_tls = true
trust_env = false

# 可选：不同任务使用不同模型或地址。
# [llm_profiles.large]
# url = "http://your-internal-llm.example/v1/chat/completions"
# model = "your-large-model"
# api_key_env = "RADAR_LLM_API_KEY"
# timeout_seconds = 120.0
# max_context_chars = 300000
# temperature = 0.0
# max_tokens = 10000

# 拆分接口的三次模型任务
[tasks.extract_evidence]
profile = "default"
temperature = 0.0
max_tokens = 5000

[tasks.candidate_modules]
profile = "default"
temperature = 0.1
max_tokens = 7000

[tasks.review_structure]
profile = "default"
temperature = 0.0
max_tokens = 5000

# 更新接口的五次模型任务
[tasks.resolve_scope]
profile = "default"
temperature = 0.0
max_tokens = 2500

[tasks.extract_deltas]
profile = "default"
temperature = 0.0
max_tokens = 6000

[tasks.plan_update]
profile = "default"
temperature = 0.0
max_tokens = 7000

[tasks.review_dependencies]
profile = "default"
temperature = 0.0
max_tokens = 5000

[tasks.review_update]
profile = "default"
temperature = 0.0
max_tokens = 5000
